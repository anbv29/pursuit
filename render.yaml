# Free preview only. Upgrade compute before treating report jobs as always-on production work.
services:
  - type: web
    name: pursuit-preview-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Apply migrations separately with the owner role before deploying this limited runtime role.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: FO_MODE
        value: demo
      - key: TRUSTED_PROXY_HOPS
        value: "2" # Vercel rewrite + Render edge; VERIFY against real X-Forwarded-For before relying on it
      - key: ACTIONS_DISABLED
        value: "false"
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: CORS_ORIGINS
        sync: false # e.g. https://pursuit.vercel.app
      - key: PUBLIC_APP_URL
        sync: false # exact public frontend HTTPS origin for OAuth and checkout returns
      - key: CONNECTION_ENCRYPTION_KEY
        sync: false # stable Fernet key; provision privately, never regenerate on redeploy
      - key: REPORT_WORKER_ENABLED
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false # provision privately; backend/.env is not uploaded to Render
      - key: FREE_PREVIEW_ENABLED
        sync: false # set true only after provisioning and verifying the free provider
      - key: FREE_RESEARCH_MODEL
        value: dots-studio/dots-3-note-preview:free
