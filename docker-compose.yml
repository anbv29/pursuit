# Local development database only. Production uses Neon (see docs/DEPLOYMENT.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pursuit
      POSTGRES_PASSWORD: pursuit_local_only
      POSTGRES_DB: pursuit
    ports:
      - "5433:5432"
    volumes:
      - pursuit_pg:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pursuit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pursuit_pg:
