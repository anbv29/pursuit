name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pursuit
          POSTGRES_PASSWORD: pursuit_local_only
          POSTGRES_DB: pursuit_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pursuit" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://pursuit:pursuit_local_only@localhost:5433/pursuit_test
      TEST_DATABASE_URL: postgresql+psycopg://pursuit:pursuit_local_only@localhost:5433/pursuit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint + static security rules (ruff incl. bandit-style S rules)
        run: ruff check . && ruff format --check .
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
      - name: Migrations apply cleanly, roll back, and re-apply
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests (real Postgres)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
