name: Keep backend warm

# The API runs on a free hosting tier that sleeps after ~15 minutes without
# traffic. After a sleep, the first request takes about a minute to come back,
# which reads in the app as "can't reach the server". A short health ping every
# 5 minutes keeps the service awake so nobody waits on a cold start.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -m 90 -w "%{http_code}" https://www.mypursuit.site/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Backend is up (HTTP $code)."
              exit 0
            fi
            echo "Attempt $attempt got HTTP ${code:-none}; retrying in 30s."
            sleep 30
          done
          echo "Backend did not respond after 3 attempts."
          exit 1
